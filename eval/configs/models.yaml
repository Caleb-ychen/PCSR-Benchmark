# ---------------- DashScope API family ----------------
# api_mode = legacy  → 对齐 Qwen_VL_Max_API_v12.py
# api_mode = fixed   → 对齐 Qwen_VL_Max_API_v12_hotfix18.py（默认）
# api_mode = openai  → 对齐 hotfix18 中的 OpenAI 兼容端点开关
qwen_vl_max_api:
  backend: qwen_vl_max_api
  need_pil: true
  cuda_visible: ""
  output_file: /root/autodl-tmp/Qwen_VL_Max_API_v12.json
  eval_mode: Qwen_VL_Max
  decoding: api_greedy_top1_v12_cot
  desc: Qwen_VL_Max
  batch_size: 8
  api_mode: legacy
  max_img_size: 1024
