# ---------------- HuggingFace-native family ----------------
llava_onevision_7b:
  backend: llava_onevision_hf
  need_pil: false
  model_path: /root/autodl-tmp/llava-onevision-qwen2-7b-ov-hf
  output_file: /root/autodl-tmp/LLaVA_OneVision_7B_v12.json
  eval_mode: LLaVA_OneVision_7B
  decoding: hard_greedy_v12_cot
  desc: LLaVA_OneVision_7B
  batch_size: 1
  torch_dtype: bfloat16

# 原 v12: add_bos=true;  hotfix18: 命令行加 --no-bos
llava_v1_6_7b:
  backend: llava_next
  need_pil: true
  model_path: /root/autodl-tmp/llava-v1.6-vicuna-7b-hf
  output_file: /root/autodl-tmp/LLaVA_v1_6_7B_v12.json
  eval_mode: LLaVA_v1_6_7B
  decoding: hard_greedy_v12_cot
  desc: LLaVA_v1_6_7B
  batch_size: 4
  torch_dtype: float16
  add_bos: true

# 原 v12: add_bos=true;  hotfix18: 命令行加 --no-bos
llama_3_2_11b_vision:
  backend: mllama
  need_pil: true
  model_path: /root/autodl-tmp/Llama-3.2-11B-Vision-Instruct
  output_file: /root/autodl-tmp/Llama_3_2_11B_Vision_Instruct_v12.json
  eval_mode: Llama_3_2_11B_Vision_Instruct
  decoding: hard_greedy_v12_cot
  desc: Llama_3_2_11B
  batch_size: 4
  torch_dtype: bfloat16
  add_bos: true

janus_pro_7b:
  backend: janus
  need_pil: true
  model_path: /root/autodl-tmp/deepseek-ai/Janus-Pro-7B
  janus_root: /root/autodl-tmp/Janus
